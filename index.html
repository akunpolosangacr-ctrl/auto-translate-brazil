<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Natural Translate ID ↔ PT-BR (Native Engine)</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #111827;
      --border: #374151;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 1rem; }
    .container { width: 100%; max-width: 850px; margin-top: 1rem; }
    header { text-align: center; margin-bottom: 1.5rem; }
    header h1 { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
    header p { font-size: 0.85rem; color: var(--muted); margin-top: 0.25rem; }
    .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1.25rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); margin-bottom: 1rem; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; justify-content: space-between; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
    .select-group { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    select, button { background-color: #1f2937; color: var(--text); border: 1px solid var(--border); padding: 0.5rem 0.75rem; border-radius: 0.5rem; font-size: 0.875rem; cursor: pointer; }
    button.primary { background-color: var(--primary); border-color: var(--primary); font-weight: 600; }
    button.primary:hover { background-color: var(--primary-hover); }
    button.danger { background-color: var(--danger); border-color: var(--danger); }
    .grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
    @media(min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
    .box { display: flex; flex-direction: column; gap: 0.5rem; }
    .box label { font-size: 0.75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; }
    textarea { width: 100%; height: 150px; background-color: #1f2937; color: var(--text); border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.75rem; font-size: 1rem; resize: none; }
    .actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; flex-wrap: wrap; }
    .history-box { max-height: 200px; overflow-y: auto; font-size: 0.85rem; }
    .history-item { padding: 0.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .toast { position: fixed; bottom: 20px; background: var(--accent); color: #fff; padding: 0.5rem 1rem; border-radius: 0.375rem; font-size: 0.875rem; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Natural Translate ID ↔ PT-BR</h1>
      <p>Powered by Native Custom Translation Engine & Neon DB (No External AI)</p>
    </header>

    <div class="card">
      <div class="toolbar">
        <div class="select-group">
          <select id="sourceLang">
            <option value="id">Bahasa Indonesia</option>
            <option value="pt-BR">Português (PT-BR)</option>
          </select>
          <button id="swapBtn">⇄</button>
          <select id="targetLang">
            <option value="pt-BR">Português (PT-BR)</option>
            <option value="id">Bahasa Indonesia</option>
          </select>
        </div>
        <div class="select-group">
          <label style="font-size:0.75rem; color:var(--muted)">Gaya:</label>
          <select id="styleSelect">
            <option value="natural">Natural Sehari-hari</option>
            <option value="chat">Santai / Chat</option>
            <option value="slang">Slang / Gaul</option>
            <option value="technical">Teknis / Game</option>
          </select>
        </div>
      </div>

      <div class="grid">
        <div class="box">
          <label>Teks Sumber</label>
          <textarea id="sourceText" placeholder="Ketik atau paste kalimat di sini..."></textarea>
          <div class="actions">
            <button id="clearBtn">Hapus</button>
            <button id="pasteBtn">Paste</button>
          </div>
        </div>
        <div class="box">
          <label>Hasil Terjemahan (Native Engine)</label>
          <textarea id="targetText" readonly placeholder="Hasil terjemahan muncul di sini..."></textarea>
          <div class="actions">
            <button id="copyBtn" class="primary">Salin</button>
            <button id="correctBtn">Kurang natural? Koreksi</button>
          </div>
        </div>
      </div>

      <div style="margin-top: 1rem;">
        <button id="translateBtn" class="primary" style="width: 100%; padding: 0.75rem; font-size: 1rem;">Terjemahkan Sekarang</button>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 0.75rem;">
        <h3 style="font-size: 1rem;">Riwayat & Memory</h3>
        <button id="clearHistoryBtn" class="danger" style="font-size: 0.75rem; padding: 0.25rem 0.5rem;">Hapus Riwayat</button>
      </div>
      <div id="historyBox" class="history-box">
        <p style="color:var(--muted); text-align:center; padding: 1rem;">Belum ada riwayat terjemahan.</p>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">Berhasil!</div>

  <script>
    const sessionId = localStorage.getItem('sid') || 'sess_' + Math.random().toString(36).substring(2) + Date.now();
    localStorage.setItem('sid', sessionId);

    const sourceText = document.getElementById('sourceText');
    const targetText = document.getElementById('targetText');
    const sourceLang = document.getElementById('sourceLang');
    const targetLang = document.getElementById('targetLang');
    const styleSelect = document.getElementById('styleSelect');
    const translateBtn = document.getElementById('translateBtn');
    const swapBtn = document.getElementById('swapBtn');
    const clearBtn = document.getElementById('clearBtn');
    const pasteBtn = document.getElementById('pasteBtn');
    const copyBtn = document.getElementById('copyBtn');
    const correctBtn = document.getElementById('correctBtn');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const historyBox = document.getElementById('historyBox');
    const toast = document.getElementById('toast');

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    swapBtn.addEventListener('click', () => {
      const temp = sourceLang.value;
      sourceLang.value = targetLang.value;
      targetLang.value = temp;
      const t = sourceText.value; sourceText.value = targetText.value; targetText.value = t;
    });

    clearBtn.addEventListener('click', () => { sourceText.value = ''; targetText.value = ''; });
    pasteBtn.addEventListener('click', async () => {
      try { sourceText.value = await navigator.clipboard.readText(); showToast('Berhasil dipaste!'); } catch(e) { showToast('Gagal paste.'); }
    });
    copyBtn.addEventListener('click', () => {
      if(targetText.value) { navigator.clipboard.writeText(targetText.value); showToast('Berhasil disalin!'); }
    });

    async function loadHistory() {
      try {
        const res = await fetch(`/api/history?sessionId=${sessionId}`);
        const data = await res.json();
        if(data.success && data.history.length > 0) {
          historyBox.innerHTML = data.history.map(h => `
            <div class="history-item">
              <div><b>${h.source_text}</b> → <span>${h.translated_text}</span></div>
              <small style="color:var(--muted)">${h.source_lang} to ${h.target_lang}</small>
            </div>
          `).join('');
        } else {
          historyBox.innerHTML = '<p style="color:var(--muted); text-align:center; padding: 1rem;">Belum ada riwayat terjemahan.</p>';
        }
      } catch(e) { console.error(e); }
    }

    translateBtn.addEventListener('click', async () => {
      const text = sourceText.value.trim();
      if(!text) return;
      translateBtn.textContent = 'Menerjemahkan (Native)...';
      translateBtn.disabled = true;

      try {
        const res = await fetch('/api/translate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, source: sourceLang.value, target: targetLang.value, style: styleSelect.value, sessionId })
        });
        const data = await res.json();
        if(res.ok && data.success) {
          targetText.value = data.translation;
          loadHistory();
        } else {
          targetText.value = 'Error: ' + (data.error || 'Gagal menerjemahkan');
        }
      } catch(err) {
        targetText.value = 'Network error.';
      } finally {
        translateBtn.textContent = 'Terjemahkan Sekarang';
        translateBtn.disabled = false;
      }
    });

    correctBtn.addEventListener('click', async () => {
      const src = sourceText.value.trim();
      const cor = prompt("Masukkan koreksi terjemahan yang lebih natural:", targetText.value);
      if(!src || !cor) return;

      try {
        const res = await fetch('/api/correction', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sourceText: src, correctedText: cor, sourceLang: sourceLang.value, targetLang: targetLang.value })
        });
        const data = await res.json();
        if(res.ok && data.success) {
          showToast('Koreksi berhasil dikirim untuk divalidasi sistem!');
        } else {
          showToast('Gagal mengirim koreksi.');
        }
      } catch(e) { showToast('Network error.'); }
    });

    clearHistoryBtn.addEventListener('click', async () => {
      if(!confirm('Hapus semua riwayat?')) return;
      await fetch(`/api/history?sessionId=${sessionId}`, { method: 'DELETE' });
      loadHistory();
      showToast('Riwayat dihapus.');
    });

    loadHistory();
  </script>
</body>
</html>
