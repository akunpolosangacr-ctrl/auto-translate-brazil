<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Translate Brazil (ID ↔ PT-BR)</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 1rem; }
    .container { width: 100%; max-width: 800px; margin-top: 1rem; }
    header { text-align: center; margin-bottom: 1.5rem; }
    header h1 { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
    header p { font-size: 0.875rem; color: var(--text-muted); margin-top: 0.25rem; }
    .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 0.75rem; padding: 1.25rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-bottom: 1rem; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; justify-content: space-between; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border-color); }
    .select-group { display: flex; align-items: center; gap: 0.5rem; }
    select, button { background-color: #0f172a; color: var(--text-main); border: 1px solid var(--border-color); padding: 0.5rem 0.75rem; border-radius: 0.5rem; font-size: 0.875rem; cursor: pointer; }
    button.primary { background-color: var(--primary); border-color: var(--primary); font-weight: 600; }
    button.primary:hover { background-color: var(--primary-hover); }
    .translation-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
    @media(min-width: 640px) { .translation-grid { grid-template-columns: 1fr 1fr; } }
    .box { display: flex; flex-direction: column; gap: 0.5rem; }
    .box label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
    textarea { width: 100%; height: 160px; background-color: #0f172a; color: var(--text-main); border: 1px solid var(--border-color); border-radius: 0.5rem; padding: 0.75rem; font-size: 1rem; resize: none; }
    .actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; flex-wrap: wrap; }
    .char-count { font-size: 0.75rem; color: var(--text-muted); text-align: right; margin-top: 0.25rem; }
    .toast { position: fixed; bottom: 20px; background: var(--accent); color: #fff; padding: 0.5rem 1rem; border-radius: 0.375rem; font-size: 0.875rem; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Auto Translate Brazil (ID ↔ PT-BR)</h1>
      <p>Natural Conversational AI Translation Engine</p>
    </header>
    <div class="card">
      <div class="toolbar">
        <div class="select-group">
          <select id="sourceLang">
            <option value="auto">Deteksi Otomatis</option>
            <option value="Indonesian">Bahasa Indonesia</option>
            <option value="Brazilian Portuguese">Português (PT-BR)</option>
          </select>
          <button id="swapBtn">⇄</button>
          <select id="targetLang">
            <option value="Brazilian Portuguese">Português (PT-BR)</option>
            <option value="Indonesian">Bahasa Indonesia</option>
          </select>
        </div>
        <div class="select-group">
          <label style="font-size:0.75rem; color:var(--text-muted)">Gaya:</label>
          <select id="toneSelect">
            <option value="natural">Natural Sehari-hari</option>
            <option value="chat">Santai seperti Chat</option>
            <option value="slang">Slang Brasil / Gaul</option>
            <option value="formal">Formal</option>
            <option value="technical">Teknis (Coding / Game)</option>
          </select>
        </div>
      </div>
      <div class="translation-grid">
        <div class="box">
          <label>Teks Sumber</label>
          <textarea id="sourceText" placeholder="Ketik atau paste teks di sini... (Shift + Enter untuk baris baru)"></textarea>
          <div class="char-count"><span id="charCount">0</span> karakter</div>
          <div class="actions">
            <button id="clearBtn">Hapus</button>
            <button id="pasteBtn">Paste</button>
          </div>
        </div>
        <div class="box">
          <label>Hasil Terjemahan</label>
          <textarea id="targetText" readonly placeholder="Hasil terjemahan natural akan muncul di sini..."></textarea>
          <div class="actions">
            <button id="copyBtn" class="primary">Salin</button>
            <button id="speakBtn">🔊 Dengar</button>
          </div>
        </div>
      </div>
      <div style="margin-top: 1rem; text-align: center;">
        <button id="translateBtn" class="primary" style="width: 100%; padding: 0.75rem; font-size: 1rem;">Terjemahkan Sekarang</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast">Berhasil disalin!</div>
  <script>
    const sourceText = document.getElementById('sourceText');
    const targetText = document.getElementById('targetText');
    const sourceLang = document.getElementById('sourceLang');
    const targetLang = document.getElementById('targetLang');
    const toneSelect = document.getElementById('toneSelect');
    const translateBtn = document.getElementById('translateBtn');
    const swapBtn = document.getElementById('swapBtn');
    const clearBtn = document.getElementById('clearBtn');
    const pasteBtn = document.getElementById('pasteBtn');
    const copyBtn = document.getElementById('copyBtn');
    const speakBtn = document.getElementById('speakBtn');
    const charCount = document.getElementById('charCount');
    const toast = document.getElementById('toast');

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    sourceText.addEventListener('input', () => charCount.textContent = sourceText.value.length);
    swapBtn.addEventListener('click', () => {
      const temp = sourceLang.value;
      sourceLang.value = targetLang.value === 'Brazilian Portuguese' ? 'Brazilian Portuguese' : 'Indonesian';
      targetLang.value = temp === 'Brazilian Portuguese' ? 'Indonesian' : 'Brazilian Portuguese';
      const t = sourceText.value; sourceText.value = targetText.value; targetText.value = t;
    });
    clearBtn.addEventListener('click', () => { sourceText.value = ''; targetText.value = ''; charCount.textContent = '0'; });
    pasteBtn.addEventListener('click', async () => {
      try { sourceText.value = await navigator.clipboard.readText(); charCount.textContent = sourceText.value.length; showToast('Dipaste!'); } catch(e) { showToast('Gagal paste.'); }
    });
    copyBtn.addEventListener('click', () => { if(targetText.value) { navigator.clipboard.writeText(targetText.value); showToast('Disalin!'); } });
    speakBtn.addEventListener('click', () => {
      if(!targetText.value) return;
      const u = new SpeechSynthesisUtterance(targetText.value);
      u.lang = targetLang.value === 'Brazilian Portuguese' ? 'pt-BR' : 'id-ID';
      window.speechSynthesis.speak(u);
    });

    async function handleTranslate() {
      const text = sourceText.value.trim();
      if (!text) return;
      translateBtn.textContent = 'Menerjemahkan...';
      translateBtn.disabled = true;
      targetText.value = 'Memproses...';
      let sessionId = localStorage.getItem('sid') || 'sess_' + Math.random().toString(36).substring(2) + Date.now();
      localStorage.setItem('sid', sessionId);

      try {
        const res = await fetch('/api/translate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, sourceLang: sourceLang.value, targetLang: targetLang.value, tone: toneSelect.value, sessionId })
        });
        const data = await res.json();
        if (res.ok && data.translatedText) {
          targetText.value = data.translatedText;
        } else {
          targetText.value = 'Error: ' + (data.error || 'Gagal');
        }
      } catch (err) {
        targetText.value = 'Network Error.';
      } finally {
        translateBtn.textContent = 'Terjemahkan Sekarang';
        translateBtn.disabled = false;
      }
    }
    translateBtn.addEventListener('click', handleTranslate);
    sourceText.addEventListener('keydown', (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleTranslate(); } });
  </script>
</body>
</html>
